# Sinh VietIME.xcodeproj bằng XcodeGen:  brew install xcodegen && xcodegen generate
name: VietIME
options:
  deploymentTarget:
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  VietEngine:
    path: VietEngine

targets:
  VietIME:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    dependencies:
      - package: VietEngine
        product: VietEngine
    settings:
      base:
        # Bundle ID của bộ gõ bắt buộc chứa ".inputmethod."
        PRODUCT_BUNDLE_IDENTIFIER: com.openmobilekit.inputmethod.VietIME
        PRODUCT_NAME: VietIME
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "12.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
